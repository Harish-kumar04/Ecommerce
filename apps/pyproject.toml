[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infalette-apps"
version = "0.1.0"
description = "Infalette backend apps (FastAPI + Celery)."
requires-python = ">=3.12"
dependencies = [
    # FastAPI backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "sentry-sdk>=2.10.0",
    "structlog>=24.2.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "redis>=5.0.0",
    # Shared internal package dependencies (config, database, auth, validation, commerce)
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "pyotp>=2.9.0",
    # Celery workers
    "celery>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "workers"]
