# Render.com Free-Tier Blueprint for Muthamilarignar Pathipagam Bookstore + API
# One-Click Deploy URL: https://dashboard.render.com/blueprint/new?repo=https://github.com/Harish-kumar04/Ecommerce
services:
  - type: web
    name: muthamilarignar-pathipagam-storefront
    runtime: node
    rootDir: apps/storefront
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_DEMO_TENANT
        value: demo-store
      - key: API_URL
        fromService:
          type: web
          name: muthamilarignar-pathipagam-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: muthamilarignar-pathipagam-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "python scripts/demo_seed.py && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./bookstore.db"
